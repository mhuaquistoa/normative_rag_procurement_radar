# Task 1 - Normative RAG. Every path, model, size, threshold, prompt and message lives here.
paths:
  raw: data/raw                 # original PDFs, never modified
  processed: data/processed     # extracted text, one record per page
  index: data/index             # persistent vector store
  logs: logs
  reports: reports

sources:
  - id: ley_32069
    titulo: "Ley N.° 32069, Ley General de Contrataciones Públicas"
    tipo: ley
    corto: "Ley N.° 32069, Ley General de Contrataciones Públicas"
    emisor: "Congreso de la República (texto publicado por OECE en gob.pe)"
    version: "Texto con modificaciones posteriores hasta el 19-07-2026"
    fecha_version: "2026-07-19"
    pagina_oficial: "https://www.gob.pe/institucion/osce/colecciones/45029-ley-n-32069-ley-general-de-contrataciones-publicas"
    url: "https://cdn.www.gob.pe/uploads/document/file/9295551/6444155-ley-general-de-contrataciones-publicas-con-modificaciones-posteriores-hasta-el-19-07-2026.pdf"
    file: ley_32069_hasta_2026-07-19.pdf
  - id: ds_001_2026_ef
    titulo: "Decreto Supremo N.° 001-2026-EF, que modifica el Reglamento de la Ley N.° 32069"
    tipo: decreto_modificatorio
    corto: "Reglamento de la Ley 32069, texto modificado por el DS N.° 001-2026-EF"
    emisor: "Ministerio de Economía y Finanzas"
    modifica: "Reglamento de la Ley N.° 32069 (aprobado por DS N.° 009-2025-EF)"
    version: "Publicado el 2026-01-08"
    fecha_version: "2026-01-08"
    pagina_oficial: "https://www.gob.pe/institucion/mef/normas-legales/7601483-001-2026-ef"
    url: "https://cdn.www.gob.pe/uploads/document/file/9263209/7601483-ds001_2026ef.pdf"
    file: ds_001_2026_ef.pdf
    fin_norma: "2474920-3"      # El Peruano publication code that closes this norm (cleaning rule R2)
    nota: "busquedas.elperuano.pe/dispositivo/NL/2474920-3 refused connections (2026-11-03); same decree taken from the MEF page on gob.pe"

source_check:
  min_chars_per_page: 100     # below this a page counts as "without extractable text" (scan, image)
  min_reading_order: 0.95     # share of consecutive article headings in ascending order

chunking:
  active: medium_ctx        # chosen with the evaluation set (Phase 2 comparison), see README
  configs:
    small:  {size: 700,  overlap: 120}
    medium: {size: 1200, overlap: 200}
    large:  {size: 1800, overlap: 300}
    medium_ctx: {size: 1200, overlap: 200, header: true}   # + "norm · article" prefix in the embedding input
    small_ctx:  {size: 700,  overlap: 120, header: true}

embeddings:
  active: local_large       # any key below - one interface, several implementations (src/embeddings.py)
  local_large:              # main model (Phase 2 comparison): best Recall@k on the evaluation set
    kind: sentence_transformers
    model: intfloat/multilingual-e5-large
    query_prefix: "query: "      # e5 models are trained with these prefixes (model card)
    passage_prefix: "passage: "
    device: null                 # null = CUDA if available, else CPU
    batch_size: 16
  local:                    # smaller sibling, kept for the comparison
    kind: sentence_transformers
    model: intfloat/multilingual-e5-base
    query_prefix: "query: "
    passage_prefix: "passage: "
    device: null
    batch_size: 32
  api:                      # API model for Phase 4 (the course's OpenAI key was revoked; see README)
    kind: gemini
    model: gemini-embedding-001
    api_key_env: GEMINI_API_KEY
    dimension: 3072              # native size (no truncation)
    max_tokens: 2048
    batch_size: 50
    retries: 4
    backoff_s: 20
    pause_s: 1

index:
  collection_prefix: normas   # one Chroma collection per (embedder, chunking config)
  distance: cosine

pricing:   # USD per 1M tokens. Verify again before reporting costs.
  deepseek-flash:
    source: https://api-docs.deepseek.com/quick_start/pricing
    verified: "2026-11-03"
    peak_hours_utc: {weekdays: [0, 1, 2, 3, 4], ranges: [[1, 4], [6, 10]]}   # Mon-Fri 01-04 and 06-10 UTC
    peak:     {input: 0.30, input_cached: 0.006, output: 1.20}
    off_peak: {input: 0.15, input_cached: 0.003, output: 0.60}
    note: "Chinese public holidays are off-peak all day; not modelled (no call fell on one)."
  gemini-embedding-001:
    source: https://ai.google.dev/gemini-api/docs/pricing
    verified: "2026-11-03"
    flat: {input: 0.15}
    note: "Paid tier price. The free tier is free of charge but its data may be used by Google."

engine:
  top_k: 5                  # fragments retrieved and sent as context
  threshold: 0.82           # best-fragment similarity below this -> abstain without calling the LLM
                            # calibrated on the evaluation set (reports/threshold_sweep_local_large_medium_ctx.csv)

llm:
  provider: deepseek
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  thinking: disabled        # no reasoning trace: faster and cheaper; the task is grounded rewriting
  temperature: 0.0
  max_tokens: 700
  timeout_s: 60

prompts:
  system: |
    Eres un asistente sobre contrataciones públicas del Perú para micro y pequeñas empresas.
    Respondes SOLO con lo que dicen los fragmentos numerados [F1], [F2]... que te doy. No uses
    conocimiento propio, no completes con normas que no estén en los fragmentos y no inventes cifras.
    Reglas:
    1. Cada afirmación lleva al final la cita del fragmento que la respalda, por ejemplo [F2].
    2. Si los fragmentos no contienen la respuesta, abstente con motivo "fuera_de_corpus".
    3. Si la pregunta pide un detalle que según los fragmentos "establece el reglamento" y ese detalle
       no está en los fragmentos, abstente con motivo "reglamento".
    4. Si usas un fragmento del Reglamento modificado por el DS 001-2026-EF, dilo ("según el Reglamento,
       modificado por el DS 001-2026-EF") y no lo presentes como si fuera la Ley.
    5. Si un fragmento dice que un numeral fue derogado o modificado, menciónalo.
    6. Escribe en español claro, para alguien que no es abogado, en 2 a 6 oraciones.
    Responde solo en json con esta forma:
    {"abstener": false, "motivo": null, "respuesta": "texto con citas [F1]", "citas": ["F1"]}
    o, si te abstienes: {"abstener": true, "motivo": "fuera_de_corpus", "respuesta": "", "citas": []}
  user: |
    Pregunta: {pregunta}

    Fragmentos:
    {contexto}

messages:
  empty_question: "Escribe una pregunta."
  abstain_threshold: "No encontré en la Ley 32069 ni en el DS 001-2026-EF un texto suficientemente relacionado con tu pregunta, así que prefiero no responder."
  abstain_out_of_corpus: "Los textos que tengo indexados (Ley 32069 y DS 001-2026-EF) no responden esta pregunta, así que no voy a improvisar una respuesta."
  abstain_reglamento: "Esta pregunta la responde el Reglamento de la Ley 32069, que no está en mi corpus: solo tengo los artículos del Reglamento que modificó el DS 001-2026-EF. Consulta el Reglamento vigente."
  abstain_no_citations: "El modelo produjo una respuesta sin citar ningún fragmento; por seguridad no la muestro."
  retrieval_error: "No se pudo consultar el índice. ¿Ejecutaste build_index.py?"
  llm_error: "Error al llamar al modelo de lenguaje"
  version_ley: "Basado en el texto de la Ley N.° 32069 con modificaciones hasta el 19-07-2026."
  version_reglamento_ds: "Incluye artículos del Reglamento en la redacción que les dio el DS 001-2026-EF (8-1-2026); el resto del Reglamento no está en el corpus, así que esta respuesta puede no ser la regla completa."

download:
  user_agent: "Mozilla/5.0 (course project; contact via GitHub)"
  timeout_s: 60
