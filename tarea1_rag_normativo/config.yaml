# Task 1 - Normative RAG. Every path, model, size, threshold, prompt and message lives here.
paths:
  raw: data/raw                 # original PDFs, never modified
  processed: data/processed     # extracted text, one record per page
  index: data/index             # persistent vector store
  logs: logs
  reports: reports

